<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VeriQ</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app">

    <section class="login-page">

      <div class="login-card">

        <div class="brand-mark">VQ</div>

        <div class="brand-block">
          <h1>VeriQ</h1>
          <p>Quality. Intelligence. Action.</p>
        </div>

        <div class="login-content">

          <span class="eyebrow">MAJID AL FUTTAIM</span>

          <h2>Welcome to VeriQ</h2>

          <p class="description">
            AI-powered quality management across every interaction,
            team and business unit.
          </p>

          <button class="primary-button" onclick="showUser()">
            Continue with MAF SSO
          </button>

          <p class="sso-note">
            Microsoft Entra ID
          </p>

        </div>

        <div class="demo-access">

          <span>Prototype role access</span>

          <div class="demo-buttons">

            <button onclick="showUser()">User</button>

            <button onclick="showManager()">Manager</button>

            <button onclick="showAdmin()">Admin</button>

          </div>

        </div>

      </div>

      <div class="login-visual">

        <div class="visual-content">

          <span class="visual-label">VERIQ</span>

          <h2>
            Quality that<br>
            understands what<br>
            is actually happening.
          </h2>

          <p>
            Evaluate. Detect. Coach. Improve.
          </p>

        </div>

      </div>

    </section>

  </div>

  <script src="app.js"></script>

</body>
</html>
